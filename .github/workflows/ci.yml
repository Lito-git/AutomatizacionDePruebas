# Pipeline de integración continua del proyecto.
# Se ejecuta en cada push a ramas de trabajo y en cada pull request hacia main.
name: CI

on:
  push:
    branches: [ main, 'feature/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio en el agente
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instala Java 21 (mismo JDK que el entorno local) y cachea ~/.m2
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compila y ejecuta solo las pruebas unitarias (feedback rápido)
      - name: Pruebas unitarias
        run: mvn -B clean test -Dtest='!RunCucumberTest'

      # 4. Ejecuta los escenarios BDD mediante el runner de Cucumber
      - name: Escenarios BDD
        run: mvn -B test -Dtest=RunCucumberTest

      # 5. Genera el reporte HTML de Surefire aunque haya fallos
      - name: Generar reporte HTML de pruebas
        if: always()
        run: mvn -B surefire-report:report-only site -DgenerateReports=false

      # 6. Publica el reporte de pruebas como artefacto descargable
      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: |
            target/site/
            target/reports/
            target/surefire-reports/

      # 7. Publica el reporte navegable de Cucumber como artefacto descargable
      - name: Publicar reporte BDD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-bdd
          path: |
            target/cucumber-report.html
            target/cucumber-report.json